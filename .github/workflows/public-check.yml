name: Public check

# Fails (and GitHub emails the owner) if a push puts local paths, account
# numbers, private emails, keys or local/secret files on the public site.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/public-check.sh
