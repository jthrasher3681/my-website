name: Rectangle screener

# Re-runs the daily rectangle-pattern scan after each US market close and
# commits the refreshed data files that /rectangle-screener/ reads.
on:
  schedule:
    - cron: "30 22 * * 1-5" # 6:30pm EDT / 5:30pm EST, Mon-Fri
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rectangle-screener
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r rectangle-screener/screener/requirements.txt

      - name: Run the scan
        working-directory: rectangle-screener
        run: python -m screener.build --yfinance --refresh-universe

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rectangle-screener/data rectangle-screener/screener/universe.csv
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Rectangle screener: $(python -c "import json;print(json.load(open('rectangle-screener/data/screen.json'))['as_of'])") close"
          git pull --rebase
          git push
