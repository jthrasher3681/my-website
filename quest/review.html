<style>
*{box-sizing:border-box}
body{margin:0;background:#12131a;color:#e8e8ee;font:15px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
a{color:#e8a854;text-decoration:none}
header{position:sticky;top:0;z-index:20;background:rgba(18,19,26,.96);backdrop-filter:blur(8px);
  border-bottom:1px solid #23242e;padding:14px 26px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
h1{font-size:19px;margin:0}
.sub{color:#8b8b9a;font-size:13px;margin-top:3px}
.tally{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pill{font-size:12px;padding:4px 11px;border-radius:99px;border:1px solid #2c2d38;background:#191a23;cursor:pointer;color:#b9b9c6}
.pill.on{border-color:#e8a854;color:#e8a854}
.pill b{color:#e8e8ee}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.act{font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid #2c2d38;background:#191a23;color:#e8e8ee;cursor:pointer}
.act:hover{border-color:#e8a854}
.act.primary{background:#e8a854;color:#12131a;border-color:#e8a854;font-weight:600}
main{padding:20px 26px 90px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#191a23;border:1px solid #23242e;border-radius:11px;overflow:hidden;transition:border-color .15s}
.card.y{border-color:#3f9d5a}.card.n{border-color:#9d3f3f}.card.m{border-color:#9d8a3f}
.frame{position:relative;aspect-ratio:16/9;background:#0d0e13;cursor:pointer}
.frame img,.frame video{width:100%;height:100%;object-fit:cover;display:block}
.frame video{background:#000}
.play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px;
  color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7);opacity:.85;pointer-events:none}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.7);border-radius:5px;padding:1px 7px;font-size:12px}
.meta{padding:10px 12px}
.cid{font-weight:600;font-size:14px}
.note{color:#9a9aa8;font-size:12.5px;margin-top:2px;min-height:32px}
.votes{display:flex;gap:6px;margin-top:9px}
.vb{flex:1;padding:8px 0;border-radius:7px;border:1px solid #2c2d38;background:#12131a;color:#b9b9c6;
  cursor:pointer;font-size:13px;font-weight:600}
.vb:hover{border-color:#54556a}
.vb.on.y{background:#1d3d29;border-color:#3f9d5a;color:#8ee0a5}
.vb.on.n{background:#3d1d1d;border-color:#9d3f3f;color:#e08e8e}
.vb.on.m{background:#3d371d;border-color:#9d8a3f;color:#e0cf8e}
#out{position:fixed;left:0;right:0;bottom:0;background:#0d0e13;border-top:1px solid #23242e;padding:14px 26px;display:none}
#out textarea{width:100%;height:74px;background:#12131a;color:#e8e8ee;border:1px solid #2c2d38;
  border-radius:8px;padding:9px;font:12.5px/1.45 ui-monospace,Menlo,monospace;resize:vertical}
.hint{color:#6d6d7c;font-size:12.5px;margin:6px 0 0}
.empty{color:#6d6d7c;padding:36px 0;text-align:center}
</style></head><body>

const KEY='quest_votes_v1';
let votes={}; try{votes=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){votes={}}
let filter='all';
function save(){try{localStorage.setItem(KEY,JSON.stringify(votes))}catch(e){}}
function setVote(id,v){votes[id]=votes[id]===v?undefined:v; if(!votes[id])delete votes[id]; save(); render();}
function clearAll(){if(confirm('Clear every verdict?')){votes={};save();render();}}
function counts(){const c={y:0,n:0,m:0,none:0};CLIPS.forEach(k=>{const v=votes[k.id];if(v)c[v]++;else c.none++});return c}
function exportOut(){
  const lines=CLIPS.filter(k=>votes[k.id]).map(k=>k.id+','+votes[k.id]);
  const txt=lines.length?('QUEST VERDICTS\n'+lines.join('\n')):'(nothing voted yet)';
  const box=document.getElementById('outbox'); box.value=txt;
  document.getElementById('out').style.display='block';
  box.select(); try{navigator.clipboard.writeText(txt)}catch(e){}
}
function render(){
  const c=counts();
  document.getElementById('tally').innerHTML=
    [['all','All '+CLIPS.length],['none','Unrated <b>'+c.none+'</b>'],['y','Keep <b>'+c.y+'</b>'],
     ['n','Cut <b>'+c.n+'</b>'],['m','Maybe <b>'+c.m+'</b>']]
    .map(([k,l])=>`<span class="pill ${filter===k?'on':''}" onclick="filter='${k}';render()">${l}</span>`).join('');
  const show=CLIPS.filter(k=>filter==='all'||(filter==='none'?!votes[k.id]:votes[k.id]===filter));
  document.getElementById('empty').style.display=show.length?'none':'block';
  document.getElementById('grid').innerHTML=show.map(k=>{
    const v=votes[k.id]||'';
    return `<div class="card ${v}">
      <div class="frame" onclick="playIt(this,'${k.u}')">
        <img loading="lazy" src="${k.th}"><div class="play">&#9654;</div><div class="dur">${k.d}s</div>
      </div>
      <div class="meta">
        <div class="cid">${k.id}</div><div class="note">${k.note}</div>
        <div class="votes">
          <button class="vb y ${v==='y'?'on':''}" onclick="setVote('${k.id}','y')">Keep</button>
          <button class="vb m ${v==='m'?'on':''}" onclick="setVote('${k.id}','m')">Maybe</button>
          <button class="vb n ${v==='n'?'on':''}" onclick="setVote('${k.id}','n')">Cut</button>
        </div>
      </div></div>`}).join('');
}
function playIt(el,url){
  if(el.querySelector('video'))return;
  el.innerHTML='<video controls autoplay playsinline src="'+url+'"></video>';
}
render();
</script></body></html>
